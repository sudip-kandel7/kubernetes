apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nodedb-app
spec:
  replicas: 2
  #revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nodedb-app
  template:
    metadata:
      labels:
        app: nodedb-app
    spec:
      containers:
      - name: nodedb-app
        image: philippaul/node-mongo-db:02
      - name: mongodb
        image: mongo

---

apiVersion: v1
kind: Service
metadata:
  name: service-my-nodedb-app
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
      app: nodedb-app
  type: LoadBalancer